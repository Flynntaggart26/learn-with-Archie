    - text: "İlk zamanlayıcı oturumunu tamamla. Toplam 5 oturum bitir. Toplam 25 oturum bitir. Toplam 100 oturum bitir. Kesintisiz 50 dakika odaklan. Tek seferde 90 dakika odaklan. 05:00 - 08:00 arasında oturum tamamla. 00:00 - 04:00 arasında oturum tamamla. Üst üste 3 gün çalış. Üst üste 7 gün günde 2 oturum tamamla. Aynı gün 5 farklı oturum tamamla. Toplam 500 dakika odaklan. Toplam 2000 dakika odaklan. Haftalık odak hedefini doldur. Biten oturumdan sonra yenisini başlat. Sekme değiştirmeden 30 dakika odaklan. Tek günde 5 saat odaklan. Erkek avatarıyla 10 oturum tamamla. Kadın avatarıyla 10 oturum tamamla. Zamanlayıcıyı düzenle veya sıfırla. Kısa moladan zamanında dön. Uzun mola sonrası oturum bitir. İki uzun oturumu tamamla. Önceki haftaya göre %20 geliş. Aylık ilk 10’a gir. İlk quizini çöz. Bir testi tamamen doğru bitir. Bir matematik konusunu %100 ustalaştır. Bir fen konusunu %100 ustalaştır. Sosyal testlerinde 50 doğruya ulaş. 20 doğruyu arka arkaya yap. Bir soruyu 5 saniyede doğru çöz. İki dakika düşünüp doğruyu bul. 10 yanlışı doğruya çevir. 5 konuyu yüksek ustalığa çıkar. Hatasız coğrafya testi bitir. Üçgenlerde 10 doğru seri yap. Temel Kavramlar quizini bitir. Zayıf konu quizini çöz. 15 soruyu arka arkaya bil. Başarı yüzdesini %85’e çıkar. Bir günde 5 quiz bitir. 50 benzersiz quiz tamamla. Son saniyede doğru cevap ver. Kolay testi hatasız bitir. Zor testi %80 başarıyla bitir. Problemlerde 5 doğru seri yap. Aynı gün Matematik ve Türkçe quizini bitir. 3 zayıf konuyu güçlendir. Tüm TYT konularında %50’ye ulaş. İlk planner görevini ekle. Günlük görevlerini tamamla ve temizle. 10 planner görevi ekle. İlk mağaza ödülünü al. 500 XP biriktir. 2000 XP biriktir. Aynı gün 3 ürün al. Premium görevi tamamla. 3 özel tema aç. 5 yüksek öncelikli görev bitir. 09:00’dan önce görev bitir. İlk ders notunu kaydet. 30 tamamlanmış görevi listele. 5 gün hedeflerini tamamla. 5 tamamlanmış görevi sil. Planner’ı bir hafta kullan. Gelecek aya görev ekle. En ucuz ödülü satın al. En pahalı ödülü satın al. AI Öğretmen’den plan tavsiyesi al. Gecikmiş görevi tamamla. Günün önemli görevini bitir. Profil temasını özelleştir. Tüm deniz figürlerini aç. 22:00’den sonra yarını planla. Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor! Gizli Başarı: Keşfedilmeyi Bekliyor!"